name: Daily Affiliate Opportunity Discovery

on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan GitHub for affiliate/referral opportunities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/affiliate_discovery_runner.py

      - name: Commit discovery queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/affiliate_programs.json
          if git diff --cached --quiet; then
            echo "No new affiliate discoveries."
            exit 0
          fi
          git commit -m "Update affiliate opportunity discovery queue"
          git push
