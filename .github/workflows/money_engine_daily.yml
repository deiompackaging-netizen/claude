name: CEO Money Engine Daily Queue

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daily commercial queue
        run: python3 scripts/money_engine.py --write

      - name: Commit queue
        run: |
          git config user.name "DEIOM Money Engine"
          git config user.email "actions@users.noreply.github.com"
          git add content/money_engine_queue.json
          git diff --cached --quiet || git commit -m "chore: refresh daily money engine queue"
          git push
