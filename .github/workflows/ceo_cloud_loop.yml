name: CEO Revenue Cloud Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

jobs:
  revenue-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build commercial queue
        run: python scripts/money_engine.py --write

      - name: Run tests when available
        run: |
          if [ -d tests ]; then python -m pytest -q || true; fi

      - name: Commit generated queue
        run: |
          git config user.name 'DEIOM CEO Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/money_engine_queue.json
          git diff --cached --quiet || git commit -m 'chore: refresh CEO revenue queue'
          git push
